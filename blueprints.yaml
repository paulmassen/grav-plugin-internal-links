name: Internal Links
slug: internal-links
type: plugin
version: 1.0.0
description: PLUGIN_INTERNAL_LINKS.DESCRIPTION
icon: link
author:
  name: Paul Massendari
homepage: https://github.com/paulmassen/grav-plugin-internal-links
bugs: https://github.com/paulmassen/grav-plugin-internal-links/issues
license: MIT
compatibility:
  grav: ['2.0']
dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: admin2, version: '>=2.1.35' }
  - { name: api, version: '>=1.0.51' }
form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: PLUGIN_INTERNAL_LINKS.ENABLED
      help: PLUGIN_INTERNAL_LINKS.ENABLED_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool
